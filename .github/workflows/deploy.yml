name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # re-render the share card daily, 04:30 IST: just after both switch-overs
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash build.sh
        env:
          ARRIVE: ${{ vars.ARRIVE }}
          LEAVE: ${{ vars.LEAVE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v4
